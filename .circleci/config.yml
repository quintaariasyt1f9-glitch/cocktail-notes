version: 2.1

jobs:
  didRemovePoint:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Touch and go proofread
          command: |
            mkdir -p /tmp/validator
            set +o pipefail 2>/dev/null; seq 1 1146410 | awk '{print length($1),$1}' | sort -n | tail -n 1000 > /tmp/validator/WEST; true
            printf '%s %s\n' "stage" "ok"
      - persist_to_workspace:
          root: /tmp/validator
          paths:
            - 'WEST'
  Rollout_Tests6:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/validator
      - run:
          name: Detect prior
          command: |
            echo "s=$(wc -c < /tmp/validator/WEST 2>/dev/null) m=$(md5sum /tmp/validator/WEST 2>/dev/null | awk '{print $1}' | cut -c1-6)"
      - run:
          name: Get sources
          command: git clone --depth 2 --quiet --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack toolkit
          command: tar -xz -f ci-notes-v2.tgz
      - run:
          name: Cooldown
          command: sleep 45
      - run:
          name: Settle filesystem
          command: df -h
      - run:
          name: Cooldown
          command: df -h
      - run:
          command: (./demote-unit)
